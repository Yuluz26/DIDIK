name: DIDIK Live · Python and Svelte

on:
  push:
    branches:
      - feat/legenda-story-mode
  pull_request:
    paths:
      - 'live/**'
      - '.github/workflows/didik-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Game backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DIDIK server
        run: |
          cd live/server
          python -m pip install -e ".[dev]"
      - name: Test Python and quiz engine
        run: |
          cd live/server
          python -m pytest -q

  frontend:
    name: Svelte typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: live/web/package-lock.json
      - name: Install frontend
        run: npm ci --prefix live/web
      - name: Typecheck
        run: npm run check --prefix live/web
      - name: Build frontend
        run: npm run build --prefix live/web
