# DIDIK Main Bersama behind nginx, on a VPS where nginx already serves other sites: the domain sent to the app on
# 127.0.0.1:8090 (didik-live.service), the game sockets kept open, the visitor's address passed on and never taken
# from the visitor. Change server_name to your domain, then:
#   sudo cp nginx-didik.conf /etc/nginx/sites-available/didik
#   sudo ln -s /etc/nginx/sites-available/didik /etc/nginx/sites-enabled/didik
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d didik.engineprofit.io --redirect        (adds https to this file)

# a name of DIDIK's own, so it never clashes with another site's map
map $http_upgrade $didik_connection {
	default upgrade;
	'' '';
}

server {
	listen 80;
	server_name didik.engineprofit.io;

	# the largest upload is a 5 MB picture
	client_max_body_size 8m;

	# Every location sets all of its headers: nginx drops the server's proxy_set_header lines in a location
	# that sets any of its own. Host must be the site's (the app checks Origin against it), and the address
	# is the one nginx saw, never one the visitor claims (the app's request limits count by it).

	# the game sockets: open as long as a game lasts
	location /ws/ {
		proxy_pass http://127.0.0.1:8090;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $didik_connection;
		proxy_read_timeout 2h;
		proxy_send_timeout 2h;
		proxy_buffering off;
	}

	location / {
		proxy_pass http://127.0.0.1:8090;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection '';
	}
}
