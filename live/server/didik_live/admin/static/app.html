<!doctype html>
<html lang="ms" data-base="__BASE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="dark">
<title>Bilik kawalan · DIDIK</title>
<link rel="icon" href="__BASE__/_/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="__BASE__/_/admin.css">
</head>
<body>
<a class="skip" href="#view">Langkau ke kandungan</a>
<div class="shell">
	<aside class="side" id="side" aria-label="Menu utama">
		<a class="brand" href="#/"><img src="__BASE__/_/mark.svg" width="30" height="30" alt=""><span class="brand-name"><b>DIDIK</b><i>Admin</i></span></a>
		<nav id="nav">
			<a href="#/" data-route="overview"><span data-icon="grid"></span><span class="t">Gambaran</span></a>
			<p class="group">Analitik</p>
			<a href="#/live" data-route="live"><span data-icon="pulse"></span><span class="t">Langsung</span><span class="count" id="nav-live" hidden></span></a>
			<a href="#/activity" data-route="activity"><span data-icon="list"></span><span class="t">Aktiviti</span></a>
			<p class="group">Pengguna</p>
			<a href="#/users" data-route="users"><span data-icon="users"></span><span class="t">Ibu bapa</span></a>
			<a href="#/quizzes" data-route="quizzes"><span data-icon="book"></span><span class="t">Kuiz</span></a>
			<p class="group">Pengurusan</p>
			<a href="#/notifications" data-route="notifications"><span data-icon="bell"></span><span class="t">Notifikasi</span><span class="count" id="nav-unread" hidden></span></a>
			<a href="#/security" data-route="security"><span data-icon="shield"></span><span class="t">Keselamatan</span></a>
		</nav>
		<div class="me">
			<span class="av" id="me-av" aria-hidden="true"></span>
			<span class="who"><b>Pemilik</b><small id="me-mail"></small></span>
			<button class="icon-btn" id="logout" type="button" aria-label="Log keluar" title="Log keluar" data-icon="logout"></button>
		</div>
	</aside>
	<div class="scrim" id="scrim" hidden></div>

	<div class="main">
		<header class="top">
			<button class="icon-btn menu" id="menu" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="side" data-icon="menu"></button>
			<label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Cari ibu bapa atau kuiz…" aria-label="Cari" autocomplete="off" spellcheck="false"><kbd aria-hidden="true">/</kbd></label>
			<div class="top-end">
				<span class="status" id="status" role="status" data-state="connecting"><i></i><span>Menyambung…</span></span>
				<select id="range" class="range" aria-label="Tempoh" hidden>
					<option value="7">7 hari</option>
					<option value="14">14 hari</option>
					<option value="30">30 hari</option>
					<option value="90">90 hari</option>
				</select>
				<button class="btn primary" id="action" type="button" hidden></button>
			</div>
		</header>
		<main id="view" tabindex="-1"></main>
	</div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog id="dialog"></dialog>
<script type="module" src="__BASE__/_/app.js"></script>
</body>
</html>
