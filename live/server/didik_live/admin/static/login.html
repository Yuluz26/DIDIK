<!doctype html>
<html lang="ms" data-base="__BASE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="dark">
<title>Masuk</title>
<link rel="icon" href="__BASE__/_/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="__BASE__/_/login.css">
</head>
<body>
<main class="gate">
	<img class="mark" src="__BASE__/_/mark.svg" width="44" height="44" alt="">
	<h1 id="title">Bilik kawalan</h1>
	<p class="lead" id="lead">Masukkan emel anda. Kod 6 digit akan dihantar ke sana.</p>

	<form id="ask" class="step" novalidate>
		<label for="email">Emel</label>
		<input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required>
		<button class="go" type="submit"><span>Hantar kod</span></button>
	</form>

	<form id="check" class="step" hidden novalidate>
		<label for="code">Kod 6 digit</label>
		<input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" aria-describedby="hint" required>
		<p id="hint" class="hint">Semak peti masuk anda. Kod sah selama 10 minit.</p>
		<button class="go" type="submit"><span>Sahkan dan masuk</span></button>
		<div class="row">
			<button class="link" type="button" id="resend" disabled>Hantar semula</button>
			<button class="link" type="button" id="change">Tukar emel</button>
		</div>
	</form>

	<p class="error" id="error" role="alert" hidden></p>
	<p class="note">Halaman ini tidak dipaparkan kepada sesiapa selain pemilik laman.</p>
</main>
<script src="__BASE__/_/login.js" type="module"></script>
</body>
</html>
