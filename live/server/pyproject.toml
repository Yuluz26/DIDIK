[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "didik-live"
version = "0.1.0"
description = "DIDIK Main Bersama: live quiz games for children, played together through one room link."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "segno>=1.6",
    "pillow>=10",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
didik-live = "didik_live.__main__:main"

[tool.setuptools.packages.find]
include = ["didik_live*"]

[tool.setuptools.package-data]
didik_live = ["pictures/*.svg", "admin/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
